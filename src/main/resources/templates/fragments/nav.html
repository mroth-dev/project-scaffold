<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="navbar bg-base-100 shadow-sm px-4 md:px-8 mb-8" th:fragment="nav">
        <div class="navbar-start !w-auto gap-4">
            <a class="btn btn-ghost text-lg px-2" th:href="@{/}">Scaffold Shop</a>
            <a class="btn btn-ghost hidden sm:inline-flex" th:href="@{/products}">Products</a>
        </div>

        <div class="navbar-center !flex-1 gap-1">
            <form class="w-full" th:action="@{/products}" method="get">
                <input type="search" name="query" placeholder="Search products..." autocomplete="off"
                       th:value="${query}" class="input w-full">
            </form>
        </div>

        <div class="navbar-end !w-auto gap-2">
            <a class="btn btn-ghost" th:href="@{/cart}">
                <div class="indicator">
                    <span class="indicator-item badge badge-secondary badge-xs" id="nav-cart-count"
                          th:text="${cartItemCount}">0</span>
                    <span class="pr-1">Cart</span>
                </div>
            </a>
            <label class="swap swap-rotate btn btn-ghost btn-circle" aria-label="Toggle dark mode">
                <input type="checkbox" id="theme-toggle" class="theme-controller" value="dark">
                <svg class="swap-off size-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <svg class="swap-on size-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </label>
            <div class="dropdown dropdown-end" th:if="${authenticated}">
                <div tabindex="0" role="button" class="btn btn-ghost" th:text="${currentUserEmail}"></div>
                <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-10 w-48 p-2 shadow">
                    <li><a th:href="@{/orders}">My Orders</a></li>
                    <li th:if="${isAdminOrManager}"><a th:href="@{/admin}">Admin</a></li>
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="w-full text-left">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
            <span class="flex gap-2" th:unless="${authenticated}">
                <a class="btn btn-ghost" th:href="@{/login}">Login</a>
                <a class="btn btn-primary" th:href="@{/register}">Register</a>
            </span>
        </div>

        <script>
            (function () {
                var stored = localStorage.getItem('theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var isDark = stored ? stored === 'dark' : prefersDark;

                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');

                var toggle = document.getElementById('theme-toggle');
                toggle.checked = isDark;
                toggle.addEventListener('change', function () {
                    var theme = toggle.checked ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                });
            })();
        </script>
    </div>
</body>
</html>
