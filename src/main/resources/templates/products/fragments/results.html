<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="productResults" id="product-results">
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-x-5 gap-y-8">
            <a class="group block" th:each="product : ${page.content}" th:href="@{'/products/' + ${product.id}}">
                <figure class="relative aspect-square rounded-box overflow-hidden bg-base-200">
                    <img th:if="${!product.images.isEmpty()}"
                         th:src="${product.images[0].thumbnailUrl ?: product.images[0].url}" th:alt="${product.name}"
                         class="h-full w-full object-cover transition-transform duration-300 ease-out group-hover:scale-105">
                    <div class="badge badge-error badge-sm absolute top-2 left-2" th:unless="${product.active}">Unavailable</div>
                </figure>
                <div class="pt-3">
                    <h3 class="font-medium truncate" th:text="${product.name}"></h3>
                    <p class="font-bold text-xl mt-0.5" th:text="${'£' + product.basePrice}"></p>
                </div>
            </a>
            <p class="col-span-full text-base-content/60" th:if="${page.content.isEmpty()}">No products found.</p>
        </div>

        <div class="flex justify-center items-center gap-4 mt-8" th:if="${page.totalPages > 1}">
            <button class="btn btn-outline btn-sm" th:if="${page.hasPrevious()}"
                    th:attr="hx-get=@{${basePath} + '/list'(query=${query}, page=${page.number - 1})}"
                    hx-target="#product-results" hx-swap="outerHTML">Previous</button>
            <span class="text-sm text-base-content/60" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}"></span>
            <button class="btn btn-outline btn-sm" th:if="${page.hasNext()}"
                    th:attr="hx-get=@{${basePath} + '/list'(query=${query}, page=${page.number + 1})}"
                    hx-target="#product-results" hx-swap="outerHTML">Next</button>
        </div>
    </section>
</body>
</html>
