<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products - Scaffold Shop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container">
        <h1>Products</h1>

        <input type="search"
               name="query"
               placeholder="Search products..."
               autocomplete="off"
               th:value="${query}"
               hx-get="/products/list"
               hx-trigger="keyup changed delay:300ms, search"
               hx-target="#product-results"
               hx-swap="outerHTML" />

        <div id="product-results" th:replace="~{products/fragments/results :: productResults}"></div>
    </main>
</body>
</html>
