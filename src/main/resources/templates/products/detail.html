<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - Scaffold Shop'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body class="min-h-screen flex flex-col">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="flex-1 container mx-auto px-4 md:px-8 max-w-6xl">
        <p class="mb-4"><a class="link link-hover" th:href="@{/products}">&larr; Back to products</a></p>

        <div class="flex flex-col md:flex-row gap-8">
            <div class="flex flex-col gap-2 md:w-96 shrink-0">
                <img th:each="image : ${product.images}" th:src="${image.url}" th:alt="${image.altText}"
                     class="rounded-box w-full object-cover">
                <p class="text-base-content/60" th:if="${product.images.isEmpty()}">No images available.</p>
            </div>

            <div class="flex-1 min-w-0">
                <h1 class="text-2xl font-bold" th:text="${product.name}"></h1>
                <p class="text-sm text-base-content/60" th:text="'SKU: ' + ${product.sku}"></p>
                <p class="mt-4" th:text="${product.description}"></p>
                <p class="mt-4 text-xl font-bold">
                    <span th:text="${'£' + product.basePrice}"></span>
                    <span class="text-base font-normal line-through text-base-content/40 ml-2"
                          th:if="${product.rrp != null}" th:text="${'£' + product.rrp}"></span>
                </p>

                <h2 class="text-lg font-semibold mt-8 mb-2">Choose an option</h2>
                <div class="overflow-x-auto">
                    <table class="table">
                        <thead>
                            <tr><th>Size</th><th>Color</th><th>Price</th><th>Stock</th><th></th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="variation : ${product.variations}">
                                <td th:text="${variation.size}"></td>
                                <td th:text="${variation.color}"></td>
                                <td th:text="${'£' + (product.basePrice + variation.priceAdjustment)}"></td>
                                <td>
                                    <span class="badge badge-sm" th:classappend="${variation.inventoryCount > 0} ? 'badge-success' : 'badge-error'"
                                          th:text="${variation.inventoryCount > 0 ? variation.inventoryCount + ' left' : 'Out of stock'}"></span>
                                </td>
                                <td>
                                    <form class="flex items-center gap-2" th:action="@{/cart/items}" method="post"
                                          hx-post="/cart/items" hx-target="#nav-cart-count" hx-swap="innerHTML">
                                        <input type="hidden" name="variationId" th:value="${variation.id}">
                                        <input type="number" name="quantity" value="1" min="1" th:max="${variation.inventoryCount}"
                                               class="input input-sm w-16">
                                        <button type="submit" class="btn btn-primary btn-sm" th:disabled="${variation.inventoryCount == 0}">Add to cart</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${product.variations.isEmpty()}">
                                <td colspan="5" class="text-base-content/60">No purchasable options for this product yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
