<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - Scaffold Shop'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body class="min-h-screen flex flex-col">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="flex-1 container mx-auto px-4 md:px-8 max-w-7xl">
        <p class="mb-4"><a class="link link-hover" th:href="@{/products}">&larr; Back to products</a></p>

        <div class="flex flex-col md:flex-row gap-8">
            <div class="flex flex-col gap-2 md:w-96 shrink-0">
                <img th:each="image : ${product.images}" th:src="${image.url}" th:alt="${image.altText}"
                     class="rounded-box w-full object-cover">
                <p class="text-base-content/60" th:if="${product.images.isEmpty()}">No images available.</p>
            </div>

            <div class="flex-1 min-w-0">
                <h1 class="text-2xl font-bold" th:text="${product.name}"></h1>
                <p class="text-sm text-base-content/60" th:text="'SKU: ' + ${product.sku}"></p>
                <p class="mt-4" th:text="${product.description}"></p>
                <p class="mt-4 text-xl font-bold">
                    <span id="price-value" th:text="${'£' + product.basePrice}"></span>
                    <span class="text-base font-normal line-through text-base-content/40 ml-2"
                          th:if="${product.rrp != null}" th:text="${'£' + product.rrp}"></span>
                </p>

                <div th:if="${!product.variations.isEmpty()}">
                    <div th:each="variation : ${product.variations}" class="variation-data hidden"
                         th:attr="data-variation-id=${variation.id},data-color=${variation.color},data-size=${variation.size},data-price=${product.basePrice + variation.priceAdjustment},data-stock=${variation.inventoryCount}"></div>

                    <h2 class="text-lg font-semibold mt-8 mb-2">Color</h2>
                    <div class="flex flex-wrap gap-2" id="color-row"></div>

                    <h2 class="text-lg font-semibold mt-6 mb-2">Size</h2>
                    <div class="flex flex-wrap gap-2" id="size-row"></div>

                    <div class="mt-4" id="stock-status"></div>

                    <form class="mt-4" th:action="@{/cart/items}" method="post"
                          hx-post="/cart/items" hx-target="#nav-cart-count" hx-swap="innerHTML">
                        <input type="hidden" name="variationId" id="variation-id-input" value="">
                        <button type="submit" class="btn btn-primary" id="add-to-cart-btn">Add to cart</button>
                    </form>
                </div>
                <p class="mt-8 text-base-content/60" th:if="${product.variations.isEmpty()}">No purchasable options for this product yet.</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var data = Array.from(document.querySelectorAll('.variation-data')).map(function (el) {
                return {
                    id: el.dataset.variationId,
                    color: el.dataset.color,
                    size: el.dataset.size,
                    price: el.dataset.price,
                    stock: parseInt(el.dataset.stock, 10)
                };
            });

            if (data.length === 0) {
                return;
            }

            var colorRow = document.getElementById('color-row');
            var sizeRow = document.getElementById('size-row');
            var variationIdInput = document.getElementById('variation-id-input');
            var addToCartBtn = document.getElementById('add-to-cart-btn');
            var stockStatus = document.getElementById('stock-status');
            var priceValue = document.getElementById('price-value');

            var colors = [];
            data.forEach(function (v) {
                if (colors.indexOf(v.color) === -1) {
                    colors.push(v.color);
                }
            });

            var basePriceText = priceValue.textContent;
            var selectedColor = colors[0];
            var selectedVariation = null;

            function selectVariation(v) {
                selectedVariation = v;
                variationIdInput.value = v.id;
                priceValue.textContent = '£' + v.price;

                var badgeClass = 'badge-success';
                var text = 'In stock';
                if (v.stock === 0) {
                    badgeClass = 'badge-error';
                    text = 'Out of stock';
                } else if (v.stock < 15) {
                    badgeClass = 'badge-warning';
                    text = 'Low stock';
                }
                stockStatus.innerHTML = '<span class="badge badge-sm ' + badgeClass + '">' + text + '</span>';
                addToCartBtn.disabled = v.stock === 0;
            }

            function clearSelection() {
                selectedVariation = null;
                variationIdInput.value = '';
                priceValue.textContent = basePriceText;
                stockStatus.innerHTML = '';
                addToCartBtn.disabled = true;
            }

            function renderColors() {
                colorRow.innerHTML = '';
                colors.forEach(function (color) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn-sm' + (color === selectedColor ? ' btn-primary' : '');
                    btn.textContent = color;
                    btn.addEventListener('click', function () {
                        selectedColor = color;
                        renderColors();
                        renderSizes(true);
                    });
                    colorRow.appendChild(btn);
                });
            }

            function renderSizes(preserveOnly) {
                var sizesForColor = data.filter(function (v) { return v.color === selectedColor; });

                var target = sizesForColor.find(function (v) {
                    return selectedVariation && v.size === selectedVariation.size;
                });
                if (target) {
                    selectVariation(target);
                } else if (preserveOnly) {
                    clearSelection();
                } else {
                    target = sizesForColor.find(function (v) { return v.stock > 0; }) || sizesForColor[0];
                    selectVariation(target);
                }

                sizeRow.innerHTML = '';
                sizesForColor.forEach(function (v) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    var isSelected = selectedVariation ? v.id === selectedVariation.id : false;
                    btn.className = 'btn btn-sm' + (isSelected ? ' btn-primary' : '') + (v.stock === 0 ? ' btn-disabled' : '');
                    btn.textContent = v.size;
                    if (v.stock === 0) {
                        btn.disabled = true;
                    }
                    btn.addEventListener('click', function () {
                        selectVariation(v);
                        renderSizes();
                    });
                    sizeRow.appendChild(btn);
                });
            }

            renderColors();
            renderSizes();
        });
    </script>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
