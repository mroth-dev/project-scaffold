<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Scaffold Shop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="flex justify-center px-4">
        <div class="card w-full max-w-sm bg-base-100 shadow-sm border border-base-300">
            <div class="card-body">
                <h1 class="card-title">Create an account</h1>

                <div role="alert" class="alert alert-error" th:if="${error}">
                    <span th:text="${error}"></span>
                </div>

                <form method="post" th:action="@{/register}" class="flex flex-col gap-3">
                    <label class="fieldset-label" for="email">Email</label>
                    <input type="email" id="email" name="email"
                           th:value="${form != null ? form.email() : ''}"
                           hx-get="/register/email-check"
                           hx-trigger="blur, keyup changed delay:500ms"
                           hx-target="#email-feedback"
                           hx-swap="innerHTML"
                           hx-params="email"
                           required autofocus class="input w-full">
                    <div id="email-feedback" th:insert="~{auth/fragments/email-feedback :: emailFeedback}"></div>

                    <label class="fieldset-label" for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" th:value="${form != null ? form.firstName() : ''}" class="input w-full">

                    <label class="fieldset-label" for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" th:value="${form != null ? form.lastName() : ''}" class="input w-full">

                    <label class="fieldset-label" for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" required class="input w-full">
                    <p class="text-sm text-base-content/60 -mt-2">At least 8 characters.</p>

                    <button type="submit" class="btn btn-primary mt-2">Register</button>
                </form>

                <p class="text-sm mt-2">Already have an account? <a class="link link-primary" th:href="@{/login}">Log in</a></p>
            </div>
        </div>
    </main>
</body>
</html>
