<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders - Scaffold Shop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container mx-auto px-4 md:px-8 max-w-4xl">
        <h1 class="text-2xl font-bold mb-6">My Orders</h1>

        <div class="overflow-x-auto" th:unless="${page.content.isEmpty()}">
            <table class="table">
                <thead>
                    <tr><th>Order</th><th>Status</th><th>Total</th><th>Placed</th><th></th></tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${page.content}">
                        <td th:text="'#' + ${order.id}"></td>
                        <td th:insert="~{orders/fragments/status-badge :: statusBadge}"></td>
                        <td th:text="${'£' + order.totalAmount}"></td>
                        <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                        <td><a class="link link-primary" th:href="@{'/orders/' + ${order.id}}">View</a></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="text-base-content/60" th:if="${page.content.isEmpty()}">You haven't placed any orders yet. <a class="link link-primary" th:href="@{/products}">Start shopping</a>.</p>
    </main>
</body>
</html>
