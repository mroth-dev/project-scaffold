<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Order #' + ${order.id} + ' - Scaffold Shop'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container">
        <p><a th:href="@{/orders}">&larr; Back to my orders</a></p>

        <h1 th:text="'Order #' + ${order.id}"></h1>

        <p>
            Status:
            <span id="order-status" hx-trigger="every 10s" hx-swap="innerHTML"
                  th:attr="hx-get=@{'/orders/' + ${order.id} + '/status'}"
                  th:insert="~{orders/fragments/status-badge :: statusBadge}"></span>
        </p>
        <p th:text="'Placed ' + ${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></p>
        <p th:text="'Total: £' + ${order.totalAmount}"></p>

        <table class="cart-table">
            <thead>
                <tr><th>Item</th><th>Quantity</th><th>Unit price</th><th>Subtotal</th></tr>
            </thead>
            <tbody>
                <tr th:each="item : ${order.items}">
                    <td>
                        <span th:text="${item.productName}"></span>
                        <span class="sku" th:text="'(' + ${item.variationSku} + ')'"></span>
                    </td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="${'£' + item.unitPrice}"></td>
                    <td th:text="${'£' + item.subtotal}"></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
