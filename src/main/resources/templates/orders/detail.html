<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Order #' + ${order.id} + ' - Scaffold Shop'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body class="min-h-screen flex flex-col">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="flex-1 container mx-auto px-4 md:px-8 max-w-7xl">
        <p class="mb-4"><a class="link link-hover" th:href="@{/orders}">&larr; Back to my orders</a></p>

        <h1 class="text-2xl font-bold" th:text="'Order #' + ${order.id}"></h1>

        <p class="mt-2 flex items-center gap-2">
            Status:
            <span id="order-status" hx-trigger="every 10s" hx-swap="innerHTML"
                  th:attr="hx-get=@{'/orders/' + ${order.id} + '/status'}"
                  th:insert="~{orders/fragments/status-badge :: statusBadge}"></span>
        </p>
        <p class="text-base-content/60" th:text="'Placed ' + ${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></p>
        <p class="font-bold mt-1" th:text="'Total: £' + ${order.totalAmount}"></p>

        <div class="overflow-x-auto mt-6">
            <table class="table">
                <thead>
                    <tr><th>Item</th><th>Quantity</th><th>Unit price</th><th>Subtotal</th></tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${order.items}">
                        <td>
                            <span th:text="${item.productName}"></span>
                            <span class="text-xs text-base-content/60" th:text="'(' + ${item.variationSku} + ')'"></span>
                        </td>
                        <td th:text="${item.quantity}"></td>
                        <td th:text="${'£' + item.unitPrice}"></td>
                        <td th:text="${'£' + item.subtotal}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
