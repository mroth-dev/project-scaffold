<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product != null} ? 'Edit Product - Scaffold Shop' : 'New Product - Scaffold Shop'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container mx-auto px-4 md:px-8 max-w-7xl py-8">
        <div th:replace="~{admin/fragments/nav :: adminNav(section='products')}"></div>

        <p class="mb-4"><a class="link link-hover" th:href="@{/admin/products}">&larr; Back to products</a></p>

        <h1 class="text-2xl font-bold mb-6" th:text="${product != null} ? 'Edit Product' : 'New Product'"></h1>

        <form th:action="${product != null} ? @{'/admin/products/' + ${product.id}} : @{/admin/products}" method="post"
              class="flex flex-col gap-4 max-w-2xl">

            <label class="form-control">
                <span class="label-text">Name</span>
                <input type="text" name="name" required class="input w-full" th:value="${product != null} ? ${product.name} : ''">
            </label>

            <label class="form-control">
                <span class="label-text">Description</span>
                <textarea name="description" class="textarea w-full" th:text="${product != null} ? ${product.description} : ''"></textarea>
            </label>

            <div class="grid grid-cols-2 gap-4">
                <label class="form-control">
                    <span class="label-text">SKU</span>
                    <input type="text" name="sku" required class="input w-full" th:value="${product != null} ? ${product.sku} : ''">
                </label>
                <label class="form-control flex-row items-center gap-2 mt-6">
                    <input type="checkbox" name="active" value="true" class="checkbox"
                           th:checked="${product == null or product.active}">
                    <span class="label-text">Active</span>
                </label>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <label class="form-control">
                    <span class="label-text">Base price</span>
                    <input type="number" step="0.01" min="0" name="basePrice" required class="input w-full"
                           th:value="${product != null} ? ${product.basePrice} : ''">
                </label>
                <label class="form-control">
                    <span class="label-text">RRP</span>
                    <input type="number" step="0.01" min="0" name="rrp" class="input w-full"
                           th:value="${product != null and product.rrp != null} ? ${product.rrp} : ''">
                </label>
            </div>

            <h2 class="text-lg font-semibold mt-4">Categories</h2>
            <div class="dropdown w-full max-w-sm" th:unless="${categoryOptions.isEmpty()}">
                <div tabindex="0" role="button" class="btn btn-outline w-full justify-between font-normal">
                    <span id="category-dropdown-label" class="truncate">Select categories</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" class="shrink-0 opacity-60"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6"/>
                    </svg>
                </div>
                <div tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-10 w-full p-2 shadow max-h-64 overflow-y-auto flex-nowrap">
                    <label class="flex items-center gap-2 pr-3 py-1.5 rounded-btn cursor-pointer hover:bg-base-200 has-[:checked]:bg-primary has-[:checked]:text-primary-content"
                           th:each="option : ${categoryOptions}"
                           th:style="${'padding-left:' + (12 + option.depth * 16) + 'px'}">
                        <input type="checkbox" name="categoryIds" class="hidden category-checkbox" th:value="${option.id}"
                               th:checked="${product != null and #lists.contains(product.categories.![id], option.id)}">
                        <span th:text="${option.label}"></span>
                    </label>
                </div>
            </div>
            <p class="text-base-content/60" th:if="${categoryOptions.isEmpty()}">No categories yet.</p>

            <h2 class="text-lg font-semibold mt-4">Variations</h2>
            <div class="overflow-x-auto">
                <table class="table">
                    <thead>
                        <tr><th>Size</th><th>Color</th><th>Color hex</th><th>SKU</th><th>Stock</th><th>Price adj.</th><th></th></tr>
                    </thead>
                    <tbody id="variation-rows">
                        <tr th:each="variation : ${product != null ? product.variations : {}}">
                            <td><input type="text" name="variationSize" class="input input-sm w-full" th:value="${variation.size}"></td>
                            <td><input type="text" name="variationColor" class="input input-sm w-full" th:value="${variation.color}"></td>
                            <td>
                                <input type="color" name="variationColorHex" class="input input-sm w-12 p-1 h-9"
                                       th:value="${variation.colorHex} ?: '#000000'"
                                       oninput="this.nextElementSibling.value = this.value">
                                <output class="text-xs text-base-content/60 ml-1" th:text="${variation.colorHex}"></output>
                            </td>
                            <td><input type="text" name="variationSku" class="input input-sm w-full" th:value="${variation.sku}"></td>
                            <td><input type="number" min="0" name="variationInventory" class="input input-sm w-20" th:value="${variation.inventoryCount}"></td>
                            <td><input type="number" step="0.01" name="variationPriceAdjustment" class="input input-sm w-24" th:value="${variation.priceAdjustment}"></td>
                            <td><button type="button" class="btn btn-ghost btn-sm" onclick="this.closest('tr').remove()">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
                <button type="button" class="btn btn-sm mt-2" onclick="addVariationRow()">Add variation</button>
            </div>

            <div class="flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary" th:text="${product != null} ? 'Save changes' : 'Create product'"></button>
                <a class="btn btn-ghost" th:href="@{/admin/products}">Cancel</a>
            </div>
        </form>

        <div th:if="${product != null}" class="mt-10 max-w-2xl">
            <h2 class="text-lg font-semibold mb-3">Images</h2>
            <div class="flex flex-wrap gap-4 mb-3" th:unless="${product.images.isEmpty()}">
                <div class="relative" th:each="image : ${product.images}">
                    <img th:src="${image.url}" alt="Product image" class="w-24 h-24 object-cover rounded-box border border-base-300">
                    <form th:action="@{'/admin/products/' + ${product.id} + '/images/' + ${image.id} + '/delete'}" method="post"
                          onsubmit="return confirm('Remove this image?');" class="absolute -top-2 -right-2">
                        <button type="submit" class="btn btn-circle btn-error btn-xs" aria-label="Remove image">&times;</button>
                    </form>
                </div>
            </div>
            <p class="text-base-content/60 mb-3" th:if="${product.images.isEmpty()}">No images uploaded yet.</p>
            <form th:action="@{'/admin/products/' + ${product.id} + '/images'}" method="post" enctype="multipart/form-data">
                <input type="file" name="files" id="product-images-file" accept="image/*" multiple required class="hidden">
                <button type="button" class="btn btn-sm" onclick="document.getElementById('product-images-file').click()">Upload images</button>
            </form>
        </div>
    </main>

    <template id="variation-row-template">
        <tr>
            <td><input type="text" name="variationSize" class="input input-sm w-full"></td>
            <td><input type="text" name="variationColor" class="input input-sm w-full"></td>
            <td>
                <input type="color" name="variationColorHex" class="input input-sm w-12 p-1 h-9" value="#000000"
                       oninput="this.nextElementSibling.value = this.value">
                <output class="text-xs text-base-content/60 ml-1"></output>
            </td>
            <td><input type="text" name="variationSku" class="input input-sm w-full"></td>
            <td><input type="number" min="0" name="variationInventory" class="input input-sm w-20"></td>
            <td><input type="number" step="0.01" name="variationPriceAdjustment" class="input input-sm w-24"></td>
            <td><button type="button" class="btn btn-ghost btn-sm" onclick="this.closest('tr').remove()">Remove</button></td>
        </tr>
    </template>
    <script>
        function addVariationRow() {
            const template = document.getElementById('variation-row-template');
            document.getElementById('variation-rows').appendChild(template.content.cloneNode(true));
        }

        const imagesInput = document.getElementById('product-images-file');
        if (imagesInput) {
            imagesInput.addEventListener('change', function () {
                if (imagesInput.files.length > 0) {
                    imagesInput.closest('form').submit();
                }
            });
        }

        function updateCategoryDropdownLabel() {
            const label = document.getElementById('category-dropdown-label');
            if (!label) {
                return;
            }
            const checked = document.querySelectorAll('.category-checkbox:checked');
            if (checked.length === 0) {
                label.textContent = 'Select categories';
            } else if (checked.length <= 2) {
                label.textContent = Array.from(checked)
                        .map(function (input) { return input.closest('label').querySelector('span').textContent; })
                        .join(', ');
            } else {
                label.textContent = checked.length + ' categories selected';
            }
        }
        document.querySelectorAll('.category-checkbox').forEach(function (checkbox) {
            checkbox.addEventListener('change', updateCategoryDropdownLabel);
        });
        updateCategoryDropdownLabel();
    </script>
</body>
</html>
