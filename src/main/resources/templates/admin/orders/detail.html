<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Order #' + ${order.id} + ' - Scaffold Shop'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container mx-auto px-4 md:px-8 max-w-7xl py-8">
        <div th:replace="~{admin/fragments/nav :: adminNav(section='orders')}"></div>

        <p class="mb-4"><a class="link link-hover" th:href="@{/admin/orders}">&larr; Back to orders</a></p>

        <h1 class="text-2xl font-bold" th:text="'Order #' + ${order.id}"></h1>
        <p class="text-base-content/60" th:text="'Customer #' + ${order.customerId}"></p>
        <p class="text-base-content/60" th:text="'Placed ' + ${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></p>
        <p class="mt-1" th:if="${order.promotionCode != null}">
            <span class="badge badge-outline font-mono" th:text="${order.promotionCode}"></span>
            <span class="text-success text-sm" th:text="'-£' + ${order.discountAmount} + ' discount applied'"></span>
        </p>
        <p class="font-bold mt-1" th:text="'Total: £' + ${order.totalAmount}"></p>

        <div class="mt-4 flex items-center gap-2" th:if="${order.status.name() != 'DELIVERED' and order.status.name() != 'CANCELLED'}">
            <form class="flex items-center gap-2" th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post">
                <select name="status" class="select select-sm">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option>
                </select>
                <button type="submit" class="btn btn-primary btn-sm">Update status</button>
            </form>
        </div>
        <div class="mt-4" th:unless="${order.status.name() != 'DELIVERED' and order.status.name() != 'CANCELLED'}">
            <span class="badge badge-sm" th:text="${order.status}"></span>
        </div>

        <div class="overflow-x-auto mt-6">
            <table class="table">
                <thead>
                    <tr><th>Item</th><th>Quantity</th><th>Unit price</th><th>Subtotal</th></tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${order.items}">
                        <td>
                            <span th:text="${item.productName}"></span>
                            <span class="text-xs text-base-content/60" th:text="'(' + ${item.variationSku} + ')'"></span>
                        </td>
                        <td th:text="${item.quantity}"></td>
                        <td th:text="${'£' + item.unitPrice}"></td>
                        <td th:text="${'£' + item.subtotal}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
