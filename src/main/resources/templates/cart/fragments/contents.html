<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="cartContents">
        <div class="overflow-x-auto" th:unless="${lines.isEmpty()}">
            <table class="table">
                <thead>
                    <tr><th>Item</th><th>Quantity</th><th>Unit price</th><th>Subtotal</th><th></th></tr>
                </thead>
                <tbody>
                    <tr th:each="line : ${lines}">
                        <td>
                            <span th:text="${line.variation.product.name}"></span>
                            <span class="text-xs text-base-content/60" th:text="'(' + ${line.variation.sku} + ')'"></span>
                        </td>
                        <td th:text="${line.quantity}"></td>
                        <td th:text="${'£' + line.unitPrice}"></td>
                        <td th:text="${'£' + line.subtotal}"></td>
                        <td>
                            <form th:action="@{'/cart/items/' + ${line.variation.id} + '/remove'}" method="post"
                                  th:attr="hx-post=@{'/cart/items/' + ${line.variation.id} + '/remove'}"
                                  hx-target="#cart-contents" hx-swap="innerHTML">
                                <button type="submit" class="btn btn-ghost btn-sm text-error">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="mt-6 max-w-sm ml-auto">
                <div th:if="${promotionCode == null}" class="mb-4">
                    <form th:action="@{/cart/promotion}" method="post" hx-post="/cart/promotion"
                          hx-target="#cart-contents" hx-swap="innerHTML" class="flex gap-2">
                        <input type="text" name="code" placeholder="Promo code" autocomplete="off"
                               class="input input-sm flex-1 uppercase">
                        <button type="submit" class="btn btn-sm">Apply</button>
                    </form>
                    <p class="text-error text-sm mt-1" th:if="${promotionError != null}" th:text="${promotionError}"></p>
                </div>

                <div th:if="${promotionCode != null}" class="mb-4 flex items-center justify-between gap-2">
                    <div>
                        <span class="badge badge-outline font-mono" th:text="${promotionCode}"></span>
                        <span class="text-sm text-base-content/60" th:if="${promotion != null}">applied</span>
                        <p class="text-error text-sm mt-1" th:if="${promotionError != null}" th:text="${promotionError}"></p>
                    </div>
                    <form th:action="@{/cart/promotion/remove}" method="post" hx-post="/cart/promotion/remove"
                          hx-target="#cart-contents" hx-swap="innerHTML">
                        <button type="submit" class="link link-error text-sm">Remove</button>
                    </form>
                </div>

                <div class="flex justify-between text-sm" th:if="${discount.signum() > 0}">
                    <span>Subtotal</span>
                    <span th:text="${'£' + subtotal}"></span>
                </div>
                <div class="flex justify-between text-sm text-success" th:if="${discount.signum() > 0}">
                    <span>Discount</span>
                    <span th:text="${'-£' + discount}"></span>
                </div>
                <div class="flex justify-between font-bold text-lg mt-1">
                    <span>Total</span>
                    <span th:text="${'£' + total}"></span>
                </div>
            </div>
        </div>

        <p class="text-base-content/60" th:if="${lines.isEmpty()}">Your cart is empty. <a class="link link-primary" th:href="@{/new-in}">Browse products</a>.</p>

        <div class="mt-6 max-w-sm ml-auto" th:if="${!lines.isEmpty() and authenticated}">
            <div class="text-sm mb-3" th:if="${hasShippingAddress}">
                <p class="font-semibold">Shipping to</p>
                <p th:text="${shippingAddress.line1}"></p>
                <p th:text="${shippingAddress.city} + ', ' + ${shippingAddress.postcode}"></p>
                <a class="link link-primary" th:href="@{/account}">Change</a>
            </div>
            <div role="alert" class="alert alert-warning text-sm mb-3" th:unless="${hasShippingAddress}">
                <span>Add a shipping address to check out. <a class="link" th:href="@{/account}">Add one now</a>.</span>
            </div>
        </div>

        <form class="mt-6" th:if="${!lines.isEmpty()}" th:action="@{/cart/checkout}" method="post">
            <button type="submit" class="btn btn-primary" th:disabled="${authenticated and !hasShippingAddress}">Checkout</button>
        </form>
    </div>
</body>
</html>
