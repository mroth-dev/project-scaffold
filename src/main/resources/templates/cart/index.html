<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - Scaffold Shop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
</head>
<body class="min-h-screen flex flex-col">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="flex-1 container mx-auto px-4 md:px-8 max-w-4xl">
        <h1 class="text-2xl font-bold mb-6">Your Cart</h1>

        <div id="cart-contents" th:insert="~{cart/fragments/contents :: cartContents}"></div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
