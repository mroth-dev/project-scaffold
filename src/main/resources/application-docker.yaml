server:
  port: 8000

spring:
  application:
    name: scaffold

  # Docker-specific database configuration
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=disable&currentSchema=public
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Docker-specific Redis configuration
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      connect-timeout: 3000ms
      jedis:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms

  # Cache Configuration for Docker environment
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes default TTL
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "ecommerce:"

  # Flyway configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # JPA configuration for Docker
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

# Management endpoints for Docker environment
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    redis:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true

# Logging configuration for Docker
logging:
  level:
    root: INFO
    com.example.scaffold: DEBUG
    org.springframework.cache: INFO
    org.springframework.data.redis: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n"

# Application-specific configuration
app:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours
    
  # Rate Limiting Configuration
  rate-limit:
    default:
      requests: ${RATE_LIMIT_DEFAULT_REQUESTS:100}
      window: ${RATE_LIMIT_DEFAULT_WINDOW:60}
    auth:
      requests: ${RATE_LIMIT_AUTH_REQUESTS:5}
      window: ${RATE_LIMIT_AUTH_WINDOW:300}
    api:
      requests: ${RATE_LIMIT_API_REQUESTS:1000}
      window: ${RATE_LIMIT_API_WINDOW:60}

  # Docker-specific settings
  docker:
    enabled: true
    network: ecommerce-network