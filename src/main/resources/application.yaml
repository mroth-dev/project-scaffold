server:
  port: 8000
  ssl:
    enabled: false

spring:
  application:
    name: scaffold

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  web:
    error:
      # Business/validation errors are handled explicitly by ApiExceptionHandler
      # and WebExceptionHandler with curated, safe messages. These settings
      # only govern the Boot fallback path (e.g. exceptions raised outside
      # controller dispatch), keeping raw exception details from leaking.
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mydb?sslmode=disable}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:changeme}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DB_LEAK_DETECTION:60000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}
      timeout: ${REDIS_TIMEOUT:2000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000ms}
      jedis:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1ms}

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes default TTL
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "scaffold:cache:"
      enable-statistics: true

# Management and Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true # exposes /actuator/health/liveness and /actuator/health/readiness for load balancers
      group:
        readiness:
          include: readinessState,db,redis
  health:
    redis:
      enabled: true
    db:
      enabled: true

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Application Configuration
app:
  # Object storage (Garage, S3-compatible) for uploaded images
  storage:
    endpoint: ${GARAGE_ENDPOINT:http://localhost:3900}
    access-key: ${GARAGE_ACCESS_KEY:garage_access_key}
    secret-key: ${GARAGE_SECRET_KEY:garage_secret_key}
    bucket: ${GARAGE_BUCKET:category-images}
    region: garage

  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890} # Should be externalized in production
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
    header: ${JWT_HEADER:Authorization}
    prefix: ${JWT_PREFIX:Bearer }

  # Cache Configuration
  cache:
    ttl:
      users: PT1H # 1 hour
      products: PT30M # 30 minutes
      categories: PT2H # 2 hours
      orders: PT15M # 15 minutes
    key-prefix: "scaffold:cache:"

  # Rate Limiting Configuration
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Property key must be "default-settings" (kebab-case for the defaultSettings
    # field) - "default" is a reserved word and can't be a Java identifier, and
    # relaxed binding won't fuzzy-match "default" to "defaultSettings".
    default-settings:
      requests: ${RATE_LIMIT_DEFAULT_REQUESTS:100}
      window: ${RATE_LIMIT_DEFAULT_WINDOW:60} # seconds
    auth:
      requests: ${RATE_LIMIT_AUTH_REQUESTS:5}
      window: ${RATE_LIMIT_AUTH_WINDOW:300} # 5 minutes
    api:
      requests: ${RATE_LIMIT_API_REQUESTS:1000}
      window: ${RATE_LIMIT_API_WINDOW:60} # 1 minute
    # Custom endpoint patterns. Map keys need bracket-escaping for Boot's relaxed
    # binder to accept the slashes ("/api/auth/login" isn't a valid unbracketed
    # property-name segment) - without the brackets these entries silently never bind.
    endpoints:
      "[/api/users/register]":
        requests: 3
        window: 3600 # 1 hour
      "[/api/auth/login]":
        requests: 10
        window: 900 # 15 minutes

# Logging Configuration
logging:
  level:
    com.example.scaffold: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.data.redis: DEBUG
