# Redis configuration for ecommerce application

# Basic Configuration
port 6379
bind 0.0.0.0
protected-mode yes

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Security
# requirepass will be set via command line

# Logging
loglevel notice

# Performance
timeout 300
tcp-keepalive 300

# Append Only File
appendonly yes
appendfsync everysec

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60