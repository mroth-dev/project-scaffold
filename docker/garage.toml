# Garage config for local development. Not for production use - secrets
# below are fixed, non-secret placeholder values checked into git, matching
# how redis.conf in this same directory is a plain, static dev config.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "dev-admin-token"
metrics_token = "dev-metrics-token"
